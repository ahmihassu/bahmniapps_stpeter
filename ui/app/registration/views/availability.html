<div>
    <div class="box-container">
     
        
        <article class="fl" style="margin: 10px;">
            <label for="ord_type"><strong>Type:</strong></label>
            <select tabindex="1" id="ord_type" ng-model="orderTypeName" ng-change="refreshOT()"> 
                <option ng-repeat="orderable in orderables" value="{{orderable}}">{{orderable.name.display}}</option>
            </select>
        </article>
        <article class="fl" ng-if="selectedOrdType && selectedOrdType.setMembers" style="margin: 10px;">
            <label for="panell"><strong>Sample:</strong></label>
            <select tabindex="2" id="panell" ng-model="ja" ng-change="refreshPan(ja)"> 
                <option ng-repeat="panel in selectedOrdType.setMembers" value="{{panel}}">{{panel.name.display}}</option>
            </select>
        </article>
        <article class="fl" ng-if="selectedPanel && selectedPanel.setMembers" style="margin: 10px;">
            <label for="ttest"><strong>Test:</strong></label>
            <select tabindex="3" id="ttest" ng-model="strselectedTest" ng-change="refreshTest(strselectedTest)"> 
                <option ng-repeat="test in selectedPanel.setMembers" value="{{test}}">{{test.name.display}}</option>
            </select>
        </article>
        <article class="fl" ng-if="selectedTest && selectedTest.uuid" style="margin: 10px;">
            <button ng-click="toggleAvailability()">Toggle Availabilty</button>
        </article>
    </div>
        <div class="container">
            <div class="registraition-search-results-container">
                Selected lab test:
                <table class="table" ng-if="selectedTest && selectedTest.uuid">
                    <tr>
                        <th>TTest or Panel Name:  </th>
                        <th>{{selectedTest.name.display}}</th>
                    </tr>
                    <tr>
                        <th>Test Availabilable: </th>
                        <th>{{boolAvailability}}</th>
                    </tr>
                </table>
            </div>
        </div>
        
        
  
</div>
