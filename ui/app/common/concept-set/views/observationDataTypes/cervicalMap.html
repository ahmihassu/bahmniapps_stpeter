<div class="cervical-map-wrapper" style="max-width: 760px;">
    <div ng-if="!fixed" style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
        <span style="font-weight: 600;">Tools</span>
        <button
            type="button"
            class="btn-small"
            ng-repeat="tool in tools"
            ng-click="setTool(tool.value)"
            ng-class="{'active': isToolSelected(tool.value)}"
            style="min-width: 90px;">
            {{tool.label}}
        </button>
        <span ng-if="selectedTool == 'eraser' || selectedTool == 'scj' || selectedTool == 'epithelium' || selectedTool == 'cancer'" style="font-weight: 600;">Size</span>
        <button
            type="button"
            class="btn-small"
            ng-if="selectedTool == 'eraser' || selectedTool == 'scj' || selectedTool == 'epithelium' || selectedTool == 'cancer'"
            ng-repeat="size in brushSizes"
            ng-click="setBrushSize(size)"
            ng-class="{'active': selectedBrushSize == size}">
            {{size}}
        </button>
        <button type="button" class="btn-small" ng-click="undo()" ng-disabled="!history.length">Undo</button>
        <button type="button" class="btn-small" ng-click="clearAll()" ng-disabled="!observation.value">Clear</button>
    </div>

    <div
        class="cervical-map-surface"
        style="position: relative; width: 100%; border: 1px solid #ccc; background: #fff;"
        ng-style="{'height': surfaceHeight + 'px'}">
        <svg viewBox="0 0 760 540" preserveAspectRatio="xMidYMid meet" style="display: block; width: 100%; height: 100%;">
            <rect x="0" y="0" width="760" height="540" fill="#ffffff"></rect>
            <rect x="16" y="16" width="728" height="508" rx="8" ry="8" fill="#f8fbf8" stroke="#2f6f4f" stroke-width="2"></rect>
            <rect x="16" y="16" width="728" height="42" fill="#e8f2ea"></rect>
            <text x="380" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#111111">Cervical Map Drawing Template</text>

            <text x="56" y="90" font-size="12" font-weight="700" fill="#2f6f4f">BLANK TEMPLATE</text>
            <circle cx="240" cy="245" r="130" fill="#ffffff" stroke="#111111" stroke-width="2"></circle>
            <line x1="110" y1="245" x2="370" y2="245" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"></line>
            <line x1="240" y1="115" x2="240" y2="375" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 4"></line>

            <rect x="465" y="100" width="230" height="200" rx="8" ry="8" fill="#ffffff" stroke="#2f6f4f" stroke-width="2"></rect>
            <text x="580" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f4f">Quick Guide</text>
            <circle cx="500" cy="165" r="10" fill="#ffffff" stroke="#111111" stroke-width="2"></circle>
            <text x="525" y="170" font-size="12" fill="#111111">OS</text>

            <path d="M 489 204
                     C 485 198, 489 190, 498 190
                     C 504 184, 515 186, 516 194
                     C 523 197, 524 206, 517 211
                     C 516 220, 505 223, 498 218
                     C 491 219, 486 214, 489 204 Z"
                  fill="none" stroke="#111111" stroke-width="2"></path>
            <text x="525" y="205" font-size="12" fill="#111111">SCJ outline</text>

            <path d="M 489 239
                     C 484 232, 489 224, 500 224
                     C 506 219, 517 223, 519 231
                     C 524 239, 519 249, 510 250
                     C 505 256, 494 256, 489 247 Z"
                  fill="rgba(120,120,120,0.18)" stroke="rgba(90,90,90,0.8)" stroke-width="1.4"></path>
            <circle cx="495" cy="230" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <circle cx="501" cy="234" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <circle cx="507" cy="229" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <circle cx="512" cy="237" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <circle cx="499" cy="243" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <circle cx="507" cy="245" r="1.2" fill="rgba(90,90,90,0.7)"></circle>
            <text x="525" y="240" font-size="12" fill="#111111">White epithelium</text>

            <path d="M 489 271
                     C 484 264, 489 256, 499 256
                     C 506 250, 517 254, 518 263
                     C 525 266, 525 276, 517 281
                     C 514 290, 504 292, 498 287
                     C 490 287, 485 281, 489 271 Z"
                  fill="#111111" stroke="#111111" stroke-width="1.2"></path>
            <text x="525" y="271" font-size="12" fill="#111111">Ca on</text>

            <text x="56" y="420" font-size="12" font-weight="700" fill="#2f6f4f">HOW TO USE</text>
            <text x="56" y="444" font-size="12" fill="#111111">1. Use SCJ to draw the squamocolumnar junction.</text>
            <text x="56" y="464" font-size="12" fill="#111111">2. Use White epithelium to shade the lesion area.</text>
            <text x="56" y="484" font-size="12" fill="#111111">3. Use OS for the cervical os marker.</text>
            <text x="56" y="504" font-size="12" fill="#111111">4. Use Ca on to place a cancer symbol. Eraser corrects markings.</text>
        </svg>
        <canvas
            class="cervical-map-canvas"
            style="position: absolute; inset: 0; width: 100%; height: 100%; cursor: {{getCursor()}};"></canvas>
    </div>
</div>
